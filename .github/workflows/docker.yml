name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Docs and repo config don't change the image. The image job is skipped (which counts as passed
  # for the required check) when only such files changed. Tags always build.
  changes:
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          build=true
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            build=false
            while read -r file; do
              case "$file" in
                *.md | docs/* | .agents/* | .vscode/* | LICENSE | .github/dependabot.yml) ;;
                *) build=true ;;
              esac
            done < <(git diff --name-only "$BASE" "$HEAD")
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Pull requests only check that the image builds; main and version tags are pushed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs only after the image is pushed, so Dokploy never pulls a stale :latest.
      - name: Deploy on Dokploy
        if: github.ref == 'refs/heads/main'
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_DEPLOY_URL }}"
