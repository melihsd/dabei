services:
  dabei:
    # Use the prebuilt image from GitHub, or run `docker compose up --build` to build locally.
    image: ghcr.io/melihsd/dabei:latest
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
    volumes:
      - dabei-data:/app/data

volumes:
  dabei-data:
