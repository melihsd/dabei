services:
  dabei:
    # Use the prebuilt image from GitHub, or run `docker compose up --build` to build locally.
    image: ghcr.io/melihsd/dabei:latest
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      # Optional: sign in with Outline
      OUTLINE_URL: ${OUTLINE_URL:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
    volumes:
      - dabei-data:/app/data

volumes:
  dabei-data:
